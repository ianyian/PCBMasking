name: Sync to Hugging Face Hub

on:
  push:
    branches:
      - main # Change to 'master' if your default branch is named master

  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          lfs: true

      # Push a single-commit SNAPSHOT of the current tree, not the full git
      # history: the repo's early history contains a >10 MiB .venv binary
      # that Hugging Face's pre-receive hook rejects. The Space only needs
      # the current files anyway.
      - name: Push snapshot to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan hf-deploy
          git add -A
          git commit -m "Deploy snapshot of ${GITHUB_SHA::7}"
          git push --force https://YianXingJian:$HF_TOKEN@huggingface.co/spaces/YianXingJian/PCBMasking hf-deploy:main
