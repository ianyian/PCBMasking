name: Sync to Hugging Face Hub

on:
  push:
    branches:
      - main # Change to 'master' if your default branch is named master

  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # The Space runs ONLY the production pipeline. The demo/, docs/ and
      # dataset assets stay on GitHub — they are demo material, and HF's
      # pre-receive hook rejects plain-git binary files anyway, so every
      # binary shipped to the Space is tracked with Git LFS.
      - name: Assemble Space snapshot
        run: |
          mkdir -p /tmp/hfdeploy
          cp hf_space/README.md hf_space/app.py hf_space/requirements.txt \
             hf_space/packages.txt /tmp/hfdeploy/
          cp pcb_privacy_mask.py /tmp/hfdeploy/
          mkdir -p /tmp/hfdeploy/templates
          cp -r templates/logos /tmp/hfdeploy/templates/logos

      - name: Push snapshot to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd /tmp/hfdeploy
          git init -b main
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git lfs install --local
          git lfs track "*.png" "*.jpg" "*.jpeg" "*.bmp"
          git add -A
          git commit -m "Deploy snapshot of ${GITHUB_SHA::7}"
          git push --force https://YianXingJian:$HF_TOKEN@huggingface.co/spaces/YianXingJian/PCBMasking main
